name: ci

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # Mirror Sapphire's no-spend posture: when this satellite repo is run on
  # the shared self-hosted Sapphire runner, /Users/aribs is the home dir,
  # not /Users/runner. Keeping setup-python's tool cache writable avoids
  # falling back to a paid hosted runner on cache miss.
  AGENT_TOOLSDIRECTORY: /Users/aribs/.github-runners/toolcache
  RUNNER_TOOL_CACHE: /Users/aribs/.github-runners/toolcache

permissions:
  contents: read
  pull-requests: read

jobs:
  lint:
    name: ruff
    # No-spend gate: skip entirely when SAPPHIRE_RUNNER is not configured
    # so we never fall back to paid ubuntu-latest minutes. Pattern mirrors
    # Sapphire's main CI workflow.
    if: ${{ vars.SAPPHIRE_RUNNER != '' }}
    runs-on: ${{ fromJSON(vars.SAPPHIRE_RUNNER || '"ubuntu-latest"') }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install ruff
      - run: ruff check --output-format=github src tests

  test:
    name: pytest
    if: ${{ vars.SAPPHIRE_RUNNER != '' }}
    runs-on: ${{ fromJSON(vars.SAPPHIRE_RUNNER || '"ubuntu-latest"') }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -e '.[dev]'
      - run: PYTHONPATH=src pytest tests/ -q --cov=src --cov-report=xml --cov-fail-under=60
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-report
          path: coverage.xml
          retention-days: 7

  smoke:
    name: container-smoke
    if: ${{ vars.SAPPHIRE_RUNNER != '' }}
    runs-on: ${{ fromJSON(vars.SAPPHIRE_RUNNER || '"ubuntu-latest"') }}
    needs: test
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build -t cyber-threat-bot:smoke .
      - name: Start container
        run: |
          docker run -d --name ctb-smoke -p 18080:8080 cyber-threat-bot:smoke
      - name: Wait for healthz
        run: |
          for i in $(seq 1 30); do
            if curl -sf http://localhost:18080/healthz; then
              echo "Health check passed"
              exit 0
            fi
            sleep 1
          done
          echo "Health check failed"
          docker logs ctb-smoke
          exit 1
      - name: Validate JSON shape
        run: |
          curl -sf http://localhost:18080/healthz | python3 -m json.tool
      - name: Cleanup
        if: always()
        run: docker stop ctb-smoke && docker rm ctb-smoke || true

  deploy:
    name: deploy
    if: >-
      ${{
        github.ref == 'refs/heads/master' &&
        vars.SAPPHIRE_RUNNER != '' &&
        vars.CYBER_THREAT_BOT_DEPLOY_ENABLED == 'true'
      }}
    runs-on: ${{ fromJSON(vars.SAPPHIRE_RUNNER || '"ubuntu-latest"') }}
    needs: [test, smoke]
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_SERVICE_ACCOUNT }}
      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: ${{ vars.GCP_PROJECT_ID }}
      - name: Trigger Cloud Build
        run: gcloud builds submit --config cloudbuild.yaml
