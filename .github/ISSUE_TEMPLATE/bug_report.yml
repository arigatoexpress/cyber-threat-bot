name: Bug report
description: Report incorrect behavior in the defensive research workflow.
title: "fix: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for helping improve cyber-threat-bot. Please keep reports defensive and do not include exploit payloads, secrets, or private data.
  - type: textarea
    id: summary
    attributes:
      label: Summary
      description: What happened, and what did you expect instead?
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Reproduction
      description: Provide the command, input shape, and observed output. Redact secrets and private indicators.
      placeholder: |
        threat-bot latest --days 7 --per-source 8 --format markdown
    validations:
      required: true
  - type: dropdown
    id: source
    attributes:
      label: Affected source
      options:
        - CISA KEV
        - NVD CVE API
        - MITRE ATT&CK
        - Dark Reading RSS
        - Rendering / output format
        - CLI / packaging
        - Other
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Python version, OS, package version or commit SHA.
      placeholder: "Python 3.11, macOS, cyber-threat-bot 0.2.0"
    validations:
      required: true
  - type: checkboxes
    id: safety
    attributes:
      label: Safety checks
      options:
        - label: I have not included secrets, private customer data, or exploit payloads.
          required: true
        - label: I can reproduce this without live credentials.
          required: true
