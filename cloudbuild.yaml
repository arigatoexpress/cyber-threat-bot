# Cloud Build pipeline for cyber-threat-bot.
#
# Deploys the container to Cloud Run in us-central1 (matches Sapphire's
# default region). To trigger:
#
#   gcloud builds submit --config cloudbuild.yaml
#
# Or wire to a GitHub trigger pointed at master.
substitutions:
  _SERVICE_NAME: cyber-threat-bot
  _REGION: us-central1
  _IMAGE: gcr.io/$PROJECT_ID/cyber-threat-bot

steps:
  - id: build
    name: gcr.io/cloud-builders/docker
    args: ["build", "-t", "${_IMAGE}:$SHORT_SHA", "-t", "${_IMAGE}:latest", "."]

  - id: push
    name: gcr.io/cloud-builders/docker
    args: ["push", "--all-tags", "${_IMAGE}"]

  - id: deploy
    name: gcr.io/google.com/cloudsdktool/cloud-sdk
    entrypoint: gcloud
    args:
      - run
      - deploy
      - ${_SERVICE_NAME}
      - --image=${_IMAGE}:$SHORT_SHA
      - --region=${_REGION}
      - --platform=managed
      - --allow-unauthenticated
      - --port=8080
      - --memory=512Mi
      - --cpu=1
      - --min-instances=0
      - --max-instances=3
      - --set-env-vars=LOG_LEVEL=INFO

images:
  - "${_IMAGE}:$SHORT_SHA"
  - "${_IMAGE}:latest"

options:
  logging: CLOUD_LOGGING_ONLY
