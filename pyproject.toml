[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cyber-threat-bot"
version = "0.2.0"
description = "Threat-led cyber research bot with analyst briefs and revenue-ready operator outputs"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [
  { name = "arigatoexpress" },
]
keywords = ["cybersecurity", "threat-intel", "cve", "mitre-attack", "cisa-kev"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Information Technology",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Security",
]
dependencies = [
  "beautifulsoup4>=4.12.0,<5",
  "requests>=2.31.0,<3",
  "pyyaml>=6.0,<7",
  "httpx>=0.27.0,<1",
  # Security floors for transitive deps (requests/httpx). Pin minimum patched
  # versions so a fresh resolve cannot reintroduce these advisories.
  "urllib3>=2.7.0",  # CVE-2026-44431, CVE-2026-44432
  "idna>=3.15",  # CVE-2026-45409
]

[project.optional-dependencies]
dev = [
  "pre-commit>=3.7.0",
  "pytest>=8.0.0",
  "pytest-cov>=5.0.0",
  "ruff>=0.4.0",
]
http = [
  "fastapi>=0.110.0,<1",
  "uvicorn[standard]>=0.27.0,<1",
  "aiohttp>=3.14.0,<4",  # CVE-2026-34993, CVE-2026-47265
  "starlette>=1.0.1",  # CVE-2026-48710 (transitive via fastapi)
]

[project.scripts]
threat-bot = "cyber_threat_bot.cli:main"

[project.urls]
Homepage = "https://github.com/arigatoexpress/cyber-threat-bot"
Repository = "https://github.com/arigatoexpress/cyber-threat-bot"
Issues = "https://github.com/arigatoexpress/cyber-threat-bot/issues"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 120
target-version = "py311"
